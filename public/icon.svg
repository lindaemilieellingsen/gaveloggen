<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip0">
      <rect width="180" height="180" rx="37" />
    </clipPath>
    <!-- Bronse/gull gradient hentet fra gavebåndene -->
    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="50%" stop-color="#A67C00" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
  </defs>
  <g clip-path="url(#clip0)">
    <!-- Background - varm kremhvit -->
    <rect width="180" height="180" rx="37" fill="#FDF8F0" />
    <!-- Gift box base -->
    <rect x="30" y="85" width="120" height="75" rx="6" fill="#FDF8F0" stroke="#8B6914" stroke-width="3" />
    <!-- Gift box lid -->
    <rect x="22" y="65" width="136" height="25" rx="5" fill="#FDF8F0" stroke="#8B6914" stroke-width="3" />
    <!-- Vertical ribbon - bronse -->
    <rect x="80" y="65" width="20" height="95" fill="#A67C00" />
    <!-- Horizontal ribbon -->
    <rect x="30" y="92" width="120" height="14" fill="#A67C00" />
    <!-- Bow left loop - gull med bronse kant -->
    <ellipse cx="68" cy="55" rx="22" ry="18" fill="#C9A227" stroke="#8B6914" stroke-width="2" />
    <!-- Bow right loop -->
    <ellipse cx="112" cy="55" rx="22" ry="18" fill="#C9A227" stroke="#8B6914" stroke-width="2" />
    <!-- Bow center - mørkere bronse -->
    <circle cx="90" cy="58" r="11" fill="#8B6914" />
    <!-- Ribbon tails -->
    <path d="M78 68 L68 95 L75 90 L82 68" fill="#A67C00" />
    <path d="M102 68 L112 95 L105 90 L98 68" fill="#A67C00" />
  </g>
</svg>
